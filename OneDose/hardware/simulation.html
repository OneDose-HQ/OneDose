<!--
File: hardware/simulation.html
Owner: Sivani
Purpose: browser-only simulation of the OneDose card scanner (ESP32 + RC522 reads a card, hashes the ID, sends it to the backend /scan, shows a green or red LED)
Inputs: none (open in a browser)
Outputs: animation only
Depends on: nothing (standalone)
-->

.sub{color:var(--mut);font-size:13px}

.vb,.btn{font:600 13px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.vb[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.nd.bad{background:#C62828;border-color:#C62828;color:#fff}
.ar{color:var(--mut)}
.panel{background:var(--navy);color:#fff;border-radius:14px;padding:20px;align-self:start}
.panel h2{margin:0 0 4px;font-size:16px}
.panel .hint{color:#B8C7D8;font-size:12px;margin:0 0 14px}
ol{list-style:none;margin:0 0 16px;padding:0}
li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid #1E3650;opacity:.55}

.row{display:flex;gap:8px;flex-wrap:wrap}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

</head>

</aside>
</div>
<footer>Concept simulation. All data is synthetic.</footer>

lab('ESP32 dev board',()=>esp.localToWorld(V(1.1,.1,-1.5)),60,22,cut,'esp');
WN.forEach((w,i)=>lab(w[0]+(w[1]?' · '+w[1]:''),()=>wires[i].curve.getPoint(.93),-110,(i-3)*26,cut,'w'+i,w[2]));
/* ---------- flow chips ---------- */
const NODES=['OneDose Reader','FastAPI','PostgreSQL','Dashboard'],fl=$('#flow'),nd=NODES.map((n,i)=>{const e=document.createElement('span');e.className='nd';e.textContent=n;if(i)fl.appendChild(Object.assign(document.createElement('span'),{className:'ar',textContent:'→'}));fl.appendChild(e);return e});
/* ---------- sequence ---------- */
let step=0,busy=false,ended=false,auto=false,timer,fin,status=STEPS.map(()=>'pending'),espOn=false,pk=null,FAIL=false;
const SMS=RM?900:1900;
function paint(){$('#steps').innerHTML=STEPS.map((s,i)=>{const st=status[i],d=FAIL&&i===3?["Consent missing or expired. Access denied, red LED lit with 2s debounce.","403 Forbidden · Red LED"]:[s[1],s[2]];
return `<li class="${st}"><b>${i+1}</b><div><strong>${s[0]}</strong>${st==='active'||st==='fail'?`<p>${d[0]}</p>`:''}${st==='skip'?'<p>Skipped</p>':''}${st==='done'||st==='active'||st==='fail'?`<code>${d[1]}</code>`:''}</div></li>`}).join('');
const on=[[0],[0],[0,1],[1],[2],[3]][step-1]||[];nd.forEach((n,i)=>n.className='nd'+(on.includes(i)?(FAIL&&step>=4&&i===1?' bad':' on'):''));
$('#tap').disabled=busy;$('#rep').disabled=!step&&!busy}
function send(cv,d){pk={cv,t:0,d:d*(RM?.2:1)};packet.visible=true}
function go(n){step=n;const bad=FAIL&&n===4;status=STEPS.map((_,i)=>i<n-1?'done':i===n-1?(bad?'fail':'active'):(FAIL&&n>=4?'skip':'pending'));
HL.clear();(n===1?['rc','coil']:n<4?['esp']:[]).forEach(k=>HL.add(k));wv.on=n===1;espOn=n===2;
if(n===1){setLed('read');setOled('Reading…');send(wires[3].curve,1.3)}
if(n===3)send(new THREE.QuadraticBezierCurve3(espMod.getWorldPosition(V(0,0,0)),V(2,9,-1),V(8,6.5,-6)),1.5);
if(bad){setLed('fail');setOled('Access denied','No active consent')}
if(n===6){setLed('ok');setOled('Verified','P-10482')}
paint()}
function next(){if(ended)return;if(step>=6||(FAIL&&step>=4)){finish();return}go(step+1);if(auto)timer=setTimeout(next,SMS)}
function finish(){clearTimeout(timer);ended=true;status=status.map(s=>s==='active'?'done':s);HL.clear();wv.on=false;espOn=false;paint();
fin=setTimeout(()=>{to(CP,'cp',0,1.2,'cp');setLed('idle');setOled('Tap patient card',null,'idle');busy=false;ended=false;paint()},RM?800:2600)}
function startTap(a){if(busy)return;FAIL=$('#fail').checked;busy=true;ended=false;auto=a;step=0;status=STEPS.map(()=>'pending');setLed('idle');setOled('Tap patient card',null,'idle');paint();
to(CP,'cp',1,1.2,'cp',()=>{go(1);if(auto)timer=setTimeout(next,SMS)})}
function reset(){clearTimeout(timer);clearTimeout(fin);busy=false;ended=false;step=0;status=STEPS.map(()=>'pending');HL.clear();wv.on=false;espOn=false;pk=null;packet.visible=false;setLed('idle');setOled('Tap patient card',null,'idle');to(CP,'cp',0,.5,'cp');paint()}
$('#tap').onclick=()=>startTap(true);
$('#stp').onclick=()=>{if(!busy)startTap(false);else{clearTimeout(timer);auto=false;next()}};
$('#rep').onclick=()=>{reset();setTimeout(()=>startTap(true),RM?50:650)};
$('#fail').onchange=()=>{if(!busy){FAIL=$('#fail').checked;paint()}};
$('#lbt').onchange=e=>{showL=e.target.checked};
document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>setView(b.dataset.v));
/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(()=>{resize();if(!tws.some(t=>t.k==='cam'))setView(document.querySelector('.vb[aria-pressed="true"]').dataset.v)}).observe(stage);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let last=performance.now(),T=0;
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
[...tws].forEach(w=>{w.t+=dt;const u=Math.min(1,w.t/w.d);w.fn(ease(u));if(u>=1){tws.splice(tws.indexOf(w),1);w.done&&w.done()}});
applyShell();
const tapP=tp.localToWorld(V(0,-.5,.65));tp.getWorldQuaternion(tq);const e=ease(clamp(CP.cp,0,1));
card.position.lerpVectors(restP,tapP,e);card.position.y+=Math.sin(Math.PI*clamp(CP.cp,0,1))*1.5;card.quaternion.slerpQuaternions(restQ,tq,e);
ledMat.color.setHex(LC[ledS]).multiplyScalar(ledS==='read'&&!RM?.6+.4*Math.sin(T*7):ledS==='idle'?.95:1);
wv.forEach((m,i)=>{const p=RM?.5:(T*.8+(i%3)/3)%1;m.visible=wv.on;m.scale.setScalar(.5+p*1.05);m.material.opacity=(1-p)*.75});
chipMat.emissiveIntensity=espOn?.5+.5*Math.sin(T*8):0;
if(pk){pk.t+=dt;const u=Math.min(1,pk.t/pk.d);packet.position.copy(pk.cv.getPoint(u));if(u>=1){pk=null;packet.visible=false}}
const w=stage.clientWidth,h=stage.clientHeight;
LB.forEach(L=>{const p=L.a().project(camera),x=(p.x+1)/2*w,y=(1-p.y)/2*h,on=L.v()&&showL&&p.z<1,bw=L.el.offsetWidth,bh=L.el.offsetHeight;
let bx=x+L.ox-(L.ox<0?bw:0),by=y+L.oy-bh/2;bx=clamp(bx,4,w-bw-4);by=clamp(by,56,h-bh-52);
L.el.style.transform=`translate(${bx}px,${by}px)`;L.d.style.transform=`translate(${x-3.5}px,${y-3.5}px)`;
L.l.setAttribute('x1',x);L.l.setAttribute('y1',y);L.l.setAttribute('x2',L.ox<0?bx+bw:bx);L.l.setAttribute('y2',by+bh/2);
const o=on?1:0;L.el.style.opacity=o;L.d.style.opacity=o;L.l.style.opacity=o;L.el.classList.toggle('on',HL.has(L.key))});
controls.update();renderer.render(scene,camera)}
resize();camera.position.set(8.5,7.5,11.5);controls.target.set(1.2,1.1,0);applyShell();paint();setView('closed');requestAnimationFrame(tick);
window.addEventListener('resize',resize);
}catch(err){
const st=document.getElementById('stage');
if(st){st.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:var(--mut)"><p style="font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px">3D Simulation Unavailable</p><p style="margin:0">WebGL or 3D graphics could not be initialized in this browser. Please check hardware acceleration or browser settings.</p></div>';}
}
})();
</script>
</body>
